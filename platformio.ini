; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = provision_secrets.ini
name = AnimatedPixelClock
description = Animated pixel clock + PC stats monitor - ESP32-S3 + 128x64 HUB75 RGB matrix
default_envs = matrix-s3-wroom

[env:matrix-base]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<*> -<lua/>
lib_deps = 
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit GFX Library@^1.12.4
	bblanchon/ArduinoJson@^7.4.2
	ricmoo/QRCode@^0.0.1
	jnthas/Improv WiFi Library@^0.0.2
	https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14

[env:matrix-s3]
extends = env:matrix-base
board = esp32-s3-devkitm-1
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

[env:matrix-s3-wroom]
extends = env:matrix-base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = 
	-DBOARD_HAS_PSRAM
upload_port = COM9
monitor_port = COM9
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

[env:matrix-waveshare-rgb]
extends = env:matrix-base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi
build_flags = 
	-DBOARD_HAS_PSRAM
	-DBOARD_WAVESHARE_RGB_MATRIX
	-DFLIGHTBOARD_ENABLED
	-DYACHTRADAR_ENABLED
	-DCONTROL_ENCODER_ENABLED
	-DMQTT_BUS_ENABLED
	-DFB_MQTT_ENABLED
	-DFLIGHTBOARD_DIRECT_ENABLED
	-DCARDS_ENABLED
	-DCAROUSEL_ENABLED
	-DCAROUSEL_ALL_STYLES
	-DWORLDCLOCK_ENABLED
	-DRAILBOARD_ENABLED
	-DRAILBOARD_DIRECT_ENABLED
	-DMEDIAPLAYER_ENABLED
	-DMARKET_ENABLED
	-DNSLUA_ENABLED
	-DLUA_EFFECTS_ENABLED
	-DCLIPS_SD_ENABLED
	-DCLIMATE_ENABLED
	-DPRESENCE_ENABLED
	; The infrared remote, ready for the knob's retirement. The module and its
	; serial console are built; the receiver itself waits for IR_RX_ENABLED and a
	; soldered TSOP - src/ir/README.md says why the pin has to be the knob's.
	-DIR_ENABLED
	-DAUDIO_MIC_ENABLED
	-DVIZ_WOW_ENABLED
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.flash_size = 32MB
board_build.partitions = large_littlefs_32MB.csv
lib_deps = 
	${env:matrix-base.lib_deps}
	https://github.com/Links2004/arduinoWebSockets.git#2.7.2
	knolleary/PubSubClient@^2.8
	; The remote's decoder, pinned to the latest release (2.9.0, 2026-01-02).
	; Compiled only into builds that define IR_RX_ENABLED - src/ir/ir.cpp is the
	; only file that includes it.
	crankyoldgit/IRremoteESP8266@2.9.0
	crankyoldgit/IRremoteESP8266@2.9.0
build_src_filter = +<*> +<lua/>

[env:provision]
extends = env:matrix-waveshare-rgb
build_src_filter = -<*> +<../bringup/provision.cpp>

[env:matrix-s3-bringup]
extends = env:matrix-s3
build_src_filter = -<*> +<../bringup/hello_matrix.cpp>

[env:matrix-wroom-bringup]
extends = env:matrix-s3-wroom
build_src_filter = -<*> +<../bringup/hello_matrix.cpp>

[env:matrix-waveshare-rgb-bringup]
extends = env:matrix-waveshare-rgb
build_src_filter = -<*> +<../bringup/hello_matrix.cpp>

[env:matrix-waveshare-rgb-luabench]
extends = env:matrix-waveshare-rgb
build_flags = 
	${env:matrix-waveshare-rgb.build_flags}
	-DNSLUA_BENCH
build_unflags = 
	-DCAROUSEL_ENABLED
	-DCAROUSEL_ALL_STYLES
	-DLUA_EFFECTS_ENABLED
