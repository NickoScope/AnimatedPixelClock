; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Secrets for env:provision live in provision_secrets.ini next to this file:
; gitignored, optional (a glob that matches nothing is fine), and edited in an
; editor so no password lands in shell history. Template:
; provision_secrets.example.ini.
extra_configs = provision_secrets.ini
name = AnimatedPixelClock
description = Animated pixel clock + PC stats monitor - ESP32-S3 + 128x64 HUB75 RGB matrix
default_envs = matrix-s3-wroom

; ================= HUB75 RGB matrix (ESP32-S3) =================
; Shared base for the full-firmware envs. Not built directly (no board).
[env:matrix-base]
; Pinned: the source targets the arduino-esp32 2.x API. Left unpinned,
; `espressif32` resolves to whatever is installed - now the pioarduino 55.x fork
; (arduino-esp32 3.3.8) - and the build fails. 6.12.0 == arduino-esp32 2.0.17.
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
; Custom-animation storage (uploaded .pca files) lives on LittleFS.
board_build.filesystem = littlefs
; The Lua runtime is opt-in per board: its vendored sources are plain .c and
; would otherwise compile into every environment, including the 4MB ones that
; have no room for it. Environments that want it add +<lua/> back.
build_src_filter = +<*> -<lua/>
lib_deps =
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit GFX Library@^1.12.4
	bblanchon/ArduinoJson@^7.4.2
	ricmoo/QRCode@^0.0.1
	; Improv-Serial WiFi push for the web flasher (tiny; stripped when IMPROV_SETUP_ENABLED = 0)
	jnthas/Improv WiFi Library@^0.0.2
	; HUB75 driver, pinned to a real tag (3.0.14 = latest as of 2026-06-30).
	https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14

; Waveshare ESP32-S3-Zero (4MB, native USB-CDC, flash via BOOT-hold).
[env:matrix-s3]
extends = env:matrix-base
board = esp32-s3-devkitm-1
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; S3-Zero is an ESP32-S3FH4R2 (4MB flash + 2MB quad PSRAM). Heap only;
	; the panel keeps its internal-SRAM DMA buffers.
	-DBOARD_HAS_PSRAM
; S3-Zero is 4MB; the esp32-s3-devkitm-1 profile defaults to 8MB. Pin to 4MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

; Main device: ESP32-S3-WROOM-1 N16R8 (16MB flash). CH343 USB-UART bridge on COM9
; (auto-reset, no BOOT-hold), UART serial. Default `pio run` target.
[env:matrix-s3-wroom]
extends = env:matrix-base
board = esp32-s3-devkitc-1
; N16R8 has 8MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_HAS_PSRAM
; Board is on COM9 (CH343 bridge). Edit if the port changes.
upload_port = COM9
monitor_port = COM9
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Waveshare ESP32-S3-RGB-Matrix driver board (SKU 34422).
; Module ESP32-S3-WROOM-2-N32R16V: 32MB flash, 16MB octal PSRAM.
; Purpose-built HUB75 board, so no hand wiring: the panel ribbon plugs straight
; in and an onboard SN74HC245 buffers the HUB75 lines (3.3V drive is a non-issue
; here). Its pin map differs from the hand-wired builds above and is selected by
; BOARD_WAVESHARE_RGB_MATRIX -- see src/display/matrix_display.h.
[env:matrix-waveshare-rgb]
extends = env:matrix-base
board = esp32-s3-devkitc-1
; Octal flash AND octal PSRAM on this module (WROOM-2-N32R16V). qio_opi - quad
; flash, octal PSRAM, right for the WROOM-1 builds above - was set here until the
; hardware arrived on 2026-09-14: the image flashed, then every boot died in
; do_core_init with flash_ret != ESP_OK right after "Octal Flash Mode Enabled".
; esptool reports this chip as 32MB flash with "Embedded PSRAM 16MB (AP_1v8)".
; opi_opi makes platform 6.12.0 pick bootloader_opi_80m (builder/main.py).
board_build.arduino.memory_type = opi_opi
build_flags =
	-DBOARD_HAS_PSRAM
	-DBOARD_WAVESHARE_RGB_MATRIX
	-DFLIGHTBOARD_ENABLED
	-DYACHTRADAR_ENABLED
	-DCONTROL_ENCODER_ENABLED
	-DMQTT_BUS_ENABLED
	-DFB_MQTT_ENABLED
	; FlightAware AeroAPI straight from the panel, with a budget; the MQTT boards are the fallback
	; when no key is stored: src/flightboard/README.md
	-DFLIGHTBOARD_DIRECT_ENABLED
	-DCARDS_ENABLED
	-DCAROUSEL_ENABLED
	-DCAROUSEL_ALL_STYLES
	-DWORLDCLOCK_ENABLED
	-DRAILBOARD_ENABLED
	; Realtime Trains straight from the panel, Home Assistant as the fallback: src/railboard/README.md
	-DRAILBOARD_DIRECT_ENABLED
	; Now playing and a remote for a Home Assistant / Music Assistant player, no audio: src/media/README.md
	-DMEDIAPLAYER_ENABLED
	; The stock market dashboard: four pages drawn from what Home Assistant computes: src/market/README.md
	-DMARKET_ENABLED
	-DNSLUA_ENABLED
	; The luasim scripts as pages: src/lua/README.md
	-DLUA_EFFECTS_ENABLED
	; Whole-track clips in a gallery on the TF card, played from it: src/clips/clip_sd.h
	-DCLIPS_SD_ENABLED
	; The board's own SHTC3 temperature/humidity sensor on I2C 47/48: src/climate/README.md
	-DCLIMATE_ENABLED
	; NOT -DSPIRAM_DMA_BUFFER. Tried 2026-09-14: it frees 130 KB of internal heap, but
	; every page showed stripes and flicker, and TLS certificate checks failed (-9984)
	; on both pinned hosts while the DMA read from PSRAM. docs/03-firmware.md in the KB.
	; The board flashes over its native USB-CDC port; there is no UART bridge
	; chip on it. UNVERIFIED on hardware -- if the port never enumerates, drop
	; these two flags and flash over UART instead.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; The module carries 32MB, but arduino-esp32 2.0.17 ships no 32MB partition
; table. Treated as 16MB; the upper half of flash simply stays unused.
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.flash_size = 32MB
; The whole 32MB octal part (ESP32-S3-WROOM-2-N32R16V), as upstream v2.3.1 does (86955e61):
; nvs and otadata stay where default_16MB.csv had them, so settings and WiFi survive;
; app slots 4.5MB each, LittleFS 23.9MB at 0x910000, coredump at 0x1FF0000.
; Changing it needs a USB flash of the partition table (OTA cannot) and a new LittleFS.
board_build.partitions = large_littlefs_32MB.csv
; Only this board carries the yacht radar, so the websocket client is scoped
; here rather than added to the shared base - the 4MB boards have no room.
; Pinned to a tag: 2.7.2 is the latest release as of 2025-12-20.
lib_deps =
	${env:matrix-base.lib_deps}
	https://github.com/Links2004/arduinoWebSockets.git#2.7.2
	knolleary/PubSubClient@^2.8
; Only this board carries the Lua runtime - 32MB of flash and 16MB of octal
; PSRAM are what make it affordable.
build_src_filter = +<*> +<lua/>

; ---- One-shot secret provisioning ----
; Writes the MQTT broker and AIS key into NVS, then gets replaced by the real
; firmware. Values come from provision_secrets.ini (gitignored, written by
; tools/provision_secrets.py import), so none of them reach git.
[env:provision]
extends = env:matrix-waveshare-rgb
build_src_filter = -<*> +<../bringup/provision.cpp>

; ---- HUB75 hardware self-test (bring-up sketch only, not the firmware) ----
; Build ONLY repo-root bringup/hello_matrix.cpp. Filter relative to
; PROJECT_SRC_DIR (=src): -<*> drops src/, ../bringup/ reaches the repo root.
; Name the file, not the directory: provision.cpp lives there too, and both
; define setup() and loop(), so the whole directory does not link.
[env:matrix-s3-bringup]
extends = env:matrix-s3
build_src_filter = -<*> +<../bringup/hello_matrix.cpp>

[env:matrix-wroom-bringup]
extends = env:matrix-s3-wroom
build_src_filter = -<*> +<../bringup/hello_matrix.cpp>

[env:matrix-waveshare-rgb-bringup]
extends = env:matrix-waveshare-rgb
build_src_filter = -<*> +<../bringup/hello_matrix.cpp>

; ---- Phase 6b bench: Lua under load while the clock renders ----
; The firmware plus src/lua/nslua_bench.cpp. The carousel is taken out so the
; clock stays on one style and the three phases compare. Not for daily use.
[env:matrix-waveshare-rgb-luabench]
extends = env:matrix-waveshare-rgb
build_flags =
	${env:matrix-waveshare-rgb.build_flags}
	-DNSLUA_BENCH
; The effects are out too: their task's 16 KB stack comes out of the internal
; heap, and the bench's numbers should stay comparable with the first run.
build_unflags =
	-DCAROUSEL_ENABLED
	-DCAROUSEL_ALL_STYLES
	-DLUA_EFFECTS_ENABLED
