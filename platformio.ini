; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = AnimatedPixelClock
description = Animated pixel clock + PC stats monitor - ESP32-S3 + 128x64 HUB75 RGB matrix
default_envs = matrix-s3-wroom

; ================= HUB75 RGB matrix (ESP32-S3) =================
; Shared base for the full-firmware envs. Not built directly (no board).
[env:matrix-base]
; Pinned: the source targets the arduino-esp32 2.x API. Left unpinned,
; `espressif32` resolves to whatever is installed - now the pioarduino 55.x fork
; (arduino-esp32 3.3.8) - and the build fails. 6.12.0 == arduino-esp32 2.0.17.
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
; Custom-animation storage (uploaded .pca files) lives on LittleFS.
board_build.filesystem = littlefs
; The Lua runtime is opt-in per board: its vendored sources are plain .c and
; would otherwise compile into every environment, including the 4MB ones that
; have no room for it. Environments that want it add +<lua/> back.
build_src_filter = +<*> -<lua/>
lib_deps =
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit GFX Library@^1.12.4
	bblanchon/ArduinoJson@^7.4.2
	ricmoo/QRCode@^0.0.1
	; Improv-Serial WiFi push for the web flasher (tiny; stripped when IMPROV_SETUP_ENABLED = 0)
	jnthas/Improv WiFi Library@^0.0.2
	; HUB75 driver, pinned to a real tag (3.0.14 = latest as of 2026-06-30).
	https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14

; Waveshare ESP32-S3-Zero (4MB, native USB-CDC, flash via BOOT-hold).
[env:matrix-s3]
extends = env:matrix-base
board = esp32-s3-devkitm-1
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; S3-Zero is an ESP32-S3FH4R2 (4MB flash + 2MB quad PSRAM). Heap only;
	; the panel keeps its internal-SRAM DMA buffers.
	-DBOARD_HAS_PSRAM
; S3-Zero is 4MB; the esp32-s3-devkitm-1 profile defaults to 8MB. Pin to 4MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

; Main device: ESP32-S3-WROOM-1 N16R8 (16MB flash). CH343 USB-UART bridge on COM9
; (auto-reset, no BOOT-hold), UART serial. Default `pio run` target.
[env:matrix-s3-wroom]
extends = env:matrix-base
board = esp32-s3-devkitc-1
; N16R8 has 8MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_HAS_PSRAM
; Board is on COM9 (CH343 bridge). Edit if the port changes.
upload_port = COM9
monitor_port = COM9
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Waveshare ESP32-S3-RGB-Matrix driver board (SKU 34422).
; Module ESP32-S3-WROOM-2-N32R16V: 32MB flash, 16MB octal PSRAM.
; Purpose-built HUB75 board, so no hand wiring: the panel ribbon plugs straight
; in and an onboard SN74HC245 buffers the HUB75 lines (3.3V drive is a non-issue
; here). Its pin map differs from the hand-wired builds above and is selected by
; BOARD_WAVESHARE_RGB_MATRIX -- see src/display/matrix_display.h.
[env:matrix-waveshare-rgb]
extends = env:matrix-base
board = esp32-s3-devkitc-1
; Octal PSRAM on this module.
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_HAS_PSRAM
	-DBOARD_WAVESHARE_RGB_MATRIX
	-DFLIGHTBOARD_ENABLED
	-DYACHTRADAR_ENABLED
	-DCONTROL_ENCODER_ENABLED
	-DMQTT_BUS_ENABLED
	-DFB_MQTT_ENABLED
	-DCARDS_ENABLED
	-DNSLUA_ENABLED
	; The board flashes over its native USB-CDC port; there is no UART bridge
	; chip on it. UNVERIFIED on hardware -- if the port never enumerates, drop
	; these two flags and flash over UART instead.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; The module carries 32MB, but arduino-esp32 2.0.17 ships no 32MB partition
; table. Treated as 16MB; the upper half of flash simply stays unused.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Only this board carries the yacht radar, so the websocket client is scoped
; here rather than added to the shared base - the 4MB boards have no room.
; Pinned to a tag: 2.7.2 is the latest release as of 2025-12-20.
lib_deps =
	${env:matrix-base.lib_deps}
	https://github.com/Links2004/arduinoWebSockets.git#2.7.2
	knolleary/PubSubClient@^2.8
; Only this board carries the Lua runtime - 32MB of flash and 16MB of octal
; PSRAM are what make it affordable.
build_src_filter = +<*> +<lua/>

; ---- One-shot secret provisioning ----
; Writes the MQTT broker and AIS key into NVS, then gets replaced by the real
; firmware. Values come from the command line so none of them reach git.
[env:provision]
extends = env:matrix-waveshare-rgb
build_src_filter = -<*> +<../bringup/provision.cpp>

; ---- HUB75 hardware self-test (bring-up sketch only, not the firmware) ----
; Build ONLY repo-root bringup/. Filter relative to PROJECT_SRC_DIR (=src):
; -<*> drops src/, +<../bringup/> reaches up to repo-root/bringup.
[env:matrix-s3-bringup]
extends = env:matrix-s3
build_src_filter = -<*> +<../bringup/>

[env:matrix-wroom-bringup]
extends = env:matrix-s3-wroom
build_src_filter = -<*> +<../bringup/>

[env:matrix-waveshare-rgb-bringup]
extends = env:matrix-waveshare-rgb
build_src_filter = -<*> +<../bringup/>
