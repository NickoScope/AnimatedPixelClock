<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="24" y="36" font-size="22" font-weight="bold" fill="#111">IR receiver on the Waveshare ESP32-S3-RGB-Matrix: GPIO0 (BOOT line)</text>
  <text x="24" y="60" fill="#444">Parts as NickoScope32 v1b (BOM: U308 TSOP2138, R313 51 Ω, C308 100 nF). 2026-09-23.</text>

  <!-- receiver -->
  <rect x="60" y="150" width="150" height="190" rx="10" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
  <text x="135" y="185" text-anchor="middle" font-weight="bold">U308</text>
  <text x="135" y="207" text-anchor="middle">TSOP2138</text>
  <text x="135" y="227" text-anchor="middle" fill="#555" font-size="13">38 kHz, Vishay</text>
  <line x1="210" y1="275" x2="250" y2="275" stroke="#111" stroke-width="2"/>
  <line x1="210" y1="300" x2="250" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="210" y1="325" x2="250" y2="325" stroke="#111" stroke-width="2"/>
  <text x="200" y="280" text-anchor="end" font-size="14">1 OUT</text>
  <text x="200" y="305" text-anchor="end" font-size="14">2 VS</text>
  <text x="200" y="330" text-anchor="end" font-size="14">3 GND</text>

  <!-- 3V3 rail and R313 -->
  <text x="330" y="118" font-weight="bold">3V3</text>
  <text x="330" y="136" font-size="13" fill="#555">header U8 pin</text>
  <line x1="345" y1="145" x2="345" y2="170" stroke="#111" stroke-width="2"/>
  <rect x="333" y="170" width="24" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="365" y="198" font-weight="bold">R313</text>
  <text x="365" y="216">51 Ω</text>
  <line x1="345" y1="230" x2="345" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="250" y1="300" x2="345" y2="300" stroke="#111" stroke-width="2"/>
  <circle cx="345" cy="300" r="4" fill="#111"/>

  <!-- C308 -->
  <line x1="345" y1="300" x2="420" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="420" y1="300" x2="420" y2="340" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="340" x2="440" y2="340" stroke="#111" stroke-width="3"/>
  <line x1="400" y1="350" x2="440" y2="350" stroke="#111" stroke-width="3"/>
  <line x1="420" y1="350" x2="420" y2="400" stroke="#111" stroke-width="2"/>
  <text x="448" y="345" font-weight="bold">C308</text>
  <text x="448" y="363">100 nF</text>
  <text x="448" y="381" font-size="13" fill="#555">right at the receiver</text>

  <!-- GND rail -->
  <line x1="250" y1="325" x2="290" y2="325" stroke="#111" stroke-width="2"/>
  <line x1="290" y1="325" x2="290" y2="400" stroke="#111" stroke-width="2"/>
  <line x1="260" y1="400" x2="440" y2="400" stroke="#111" stroke-width="2"/>
  <line x1="330" y1="412" x2="380" y2="412" stroke="#111" stroke-width="2"/>
  <line x1="340" y1="422" x2="370" y2="422" stroke="#111" stroke-width="2"/>
  <line x1="350" y1="432" x2="360" y2="432" stroke="#111" stroke-width="2"/>
  <line x1="355" y1="400" x2="355" y2="412" stroke="#111" stroke-width="2"/>
  <text x="385" y="440" font-weight="bold">GND</text>
  <text x="385" y="458" font-size="13" fill="#555">header U8 pin</text>

  <!-- OUT to BOOT -->
  <line x1="250" y1="275" x2="300" y2="275" stroke="#c0392b" stroke-width="3"/>
  <line x1="300" y1="275" x2="300" y2="255" stroke="#c0392b" stroke-width="3"/>
  <line x1="300" y1="255" x2="600" y2="255" stroke="#c0392b" stroke-width="3"/>
  <text x="430" y="245" fill="#c0392b" font-weight="bold">OUT wire, to the BOOT pad</text>

  <!-- board side -->
  <rect x="600" y="100" width="330" height="360" rx="12" fill="#f7fbff" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="765" y="126" text-anchor="middle" fill="#1f5fa8" font-weight="bold">on the board (vendor schematic)</text>
  <circle cx="620" cy="255" r="6" fill="#c0392b"/>
  <line x1="620" y1="255" x2="760" y2="255" stroke="#111" stroke-width="2"/>
  <text x="640" y="245" font-weight="bold">IO0 / BOOT net</text>
  <!-- R8 -->
  <line x1="760" y1="255" x2="760" y2="225" stroke="#111" stroke-width="2"/>
  <rect x="748" y="165" width="24" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="760" y1="165" x2="760" y2="150" stroke="#111" stroke-width="2"/>
  <text x="745" y="148" text-anchor="end">3V3</text>
  <text x="780" y="192" font-weight="bold">R8</text>
  <text x="780" y="210">10 kΩ pull-up</text>
  <!-- Key2 -->
  <line x1="760" y1="255" x2="760" y2="300" stroke="#111" stroke-width="2"/>
  <circle cx="760" cy="305" r="5" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="760" cy="345" r="5" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="772" y1="300" x2="772" y2="350" stroke="#111" stroke-width="2"/>
  <line x1="760" y1="350" x2="760" y2="380" stroke="#111" stroke-width="2"/>
  <line x1="740" y1="380" x2="780" y2="380" stroke="#111" stroke-width="2"/>
  <text x="782" y="330" font-weight="bold">Key2 BOOT</text>
  <text x="782" y="348" font-size="13">C9 across it: NC</text>
  <text x="788" y="386">GND</text>
  <!-- knob SW -->
  <line x1="690" y1="255" x2="690" y2="410" stroke="#111" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="620" y="430" font-size="13">knob's switch, also to GND</text>
  <text x="620" y="447" font-size="13">(kept as the backup control)</text>
  <circle cx="690" cy="255" r="4" fill="#111"/>

  <!-- notes -->
  <text x="24" y="500" font-size="14" fill="#111">• TSOP21xx pinout is 1 OUT, 2 VS, 3 GND - not the TSOP48xx order (2 GND, 3 VS). Pin order: see the part's datasheet drawing before soldering.</text>
  <text x="24" y="522" font-size="14" fill="#111">• No pull-up of your own: R8 10 kΩ is on the board. R307 2.2 kΩ from v1b may be added, not needed. IO45/IO46 keep the knob.</text>
  <text x="24" y="544" font-size="14" fill="#111">• Find the IO0 side of the BOOT button with a meter: ~10 kΩ to 3V3 (through R8); the other side reads 0 Ω to GND.</text>
</svg>
