# Media player for the LED panel: add this entry to AppDaemon's apps.yaml
# (/addon_configs/a0d7b954_appdaemon/apps/apps.yaml), after the others.
#
# Needs, in the same apps directory: matrix_media.py (one file, no helpers).
# The broker login is the one flight_board already reads from AppDaemon's
# secrets.yaml (nicko_mqtt_user, nicko_mqtt_pass): nothing new to enter.
# The whole install, and how to check it: src/media/README.md, "Home Assistant".

matrix_media:
  module: matrix_media
  class: MatrixMedia
  # The panel's six hex digits: portal > Panel > Media > Diagnostics > topics,
  # or the boot log line "[media] topics nickoscope_matrix/<device>/media/...".
  device: "d20ec8"         # this panel: /api/media "dev", 2026-09-14
  # At most 8. The panel can follow and command these and nothing else.
  players:
    - media_player.nickoscope32_audio_s3
    - media_player.eversolo_dmp_a8
    - media_player.atom_voice_atom_speaker
    - media_player.yandex_station_u00c533009fayb
    - media_player.yandex_station_r1068ye002nbng
  # Followed until the panel chooses; the panel's choice is retained and wins.
  default_player: media_player.nickoscope32_audio_s3
  # Music Assistant's config entry, for the radio favourites. An id, not a
  # secret. Leave the line out and the app sends an empty favourites list.
  ma_config_entry_id: 01KSTJEYV7QZEMM7CMJEWXVEHP
  # The broker by IP: this container has no mDNS (the note on marta_bridge here).
  mqtt_host: "192.168.4.35"
  mqtt_port: 1883
  mqtt_user: !secret nicko_mqtt_user     # the login flight_board already uses here
  mqtt_pass: !secret nicko_mqtt_pass
  keepalive: 60          # s: the same state again when nothing changes; the panel says STALE after 150
  min_interval: 1        # s: at most one state payload this often
  favs_refresh: 900      # s: how often Music Assistant's favourites are read again
  # tags: {media_player.eversolo_dmp_a8: "EVS"}   # up to four of A-Z 0-9; default MA, YA or HA
