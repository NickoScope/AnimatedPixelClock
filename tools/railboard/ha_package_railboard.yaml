# Rail board for the LED matrix: any UK station, from Realtime Trains.
#
# ── Two paths to the same board ──────────────────────────────────────────────
# 1. The panel asks Realtime Trains itself (firmware RAILBOARD_DIRECT_ENABLED,
#    token in the panel's NVS). No Home Assistant needed.
# 2. Home Assistant asks, and publishes retained boards over MQTT. The panel
#    uses them when it has no token of its own, or its own fetch has failed.
#    This package is the part of path 2 that makes no RTT call: the station
#    helper and the two automations that follow the panel's choice and publish
#    its settings. The RTT poll itself is ONE of these, never both:
#      A. the AppDaemon app  tools/railboard/appdaemon/   (recommended)
#      B. the shell_command  tools/railboard/ha_package_railboard_shell.yaml
#    Install steps and the trade-offs: src/railboard/README.md, "Home Assistant".
#
# Topics:
#   nickoscope_matrix/railboard/select                {"crs":"GLD"}  from the panel
#   nickoscope_matrix/railboard/<crs>/departures | arrivals | status   from the poll
#   nickoscope_matrix/railboard/<crs>/config          from this package
#
# ── The token, and why the poll is not in this file any more ─────────────────
# The owner's token from api-portal.rtt.io is a REFRESH token. main.yml lines
# 12-21 and 1644-1669: it has to be exchanged at GET /api/get_access_token for
# a short-life access token, which the other calls then use. The earlier poll
# sent the refresh token straight to /gb-nr/location and got 401 AUTH.
#
# An automation can do the exchange, but the access token would then pass
# through a response variable, and automation traces store the variables they
# change (core helpers/trace.py, "changed_variables") and are saved to disk
# (core components/trace, .storage/trace.saved_traces). No template or helper
# keeps it out of that. So the exchange lives in Python: in AppDaemon's
# process memory (A), or in a short-lived process whose output carries no
# token (B).
#
# One daily quota. Both the panel and Home Assistant spend the same token's
# requests. The panel slows down when RTT reports fewer than max(500, limit/10)
# left today; poll A or B keeps its 20 s. Remaining requests are on the
# panel's Rail board page in the portal.
#
# Realtime Trains' terms (main.yml line 19): "no token is placed in a
# distributable user application unless specifically authorised by us ...
# End-user applications are expected to proxy their requests through a
# server-side application". Path 1 puts the token in the panel. The owner has
# been told and decides.
#
# ── Install (this file) ──────────────────────────────────────────────────────
# 1. configuration.yaml, once, if packages are not already enabled:
#
#      homeassistant:
#        packages: !include_dir_named packages
#
# 2. Replace <config>/packages/railboard.yaml with this file. It no longer has
#    the rest_command or the "fetch Realtime Trains" automation (switched off
#    since 14 Sep 19:14); both disappear with the replacement.
#
# 3. Restart Home Assistant, or reload automations and input_text.
#
# ── Written against (read 2026-09-14) ────────────────────────────────────────
#  packages          https://www.home-assistant.io/docs/configuration/packages/
#  mqtt.publish      https://www.home-assistant.io/integrations/mqtt/
#                    (fields topic/payload/retain - core mqtt/services.yaml)
#  mqtt trigger      https://www.home-assistant.io/docs/automation/trigger/#mqtt-trigger
#                    trigger.payload_json: https://www.home-assistant.io/docs/automation/templating/
#                    (absent when the payload is not JSON; no retain filter, so a
#                    retained selection fires it on subscribe - core mqtt/trigger.py)
#  state trigger     https://www.home-assistant.io/triggers/state/
#  time_pattern      https://www.home-assistant.io/docs/automation/trigger/#time-pattern-trigger
#  input_text        https://www.home-assistant.io/integrations/input_text/
#                    (pattern is client-side only; set_value ignores a value of the
#                    wrong length with a warning - core input_text/__init__.py)
#  automation modes  https://www.home-assistant.io/docs/automation/modes/
#  traces            https://www.home-assistant.io/docs/automation/troubleshooting/#traces
#  system_log.write  https://www.home-assistant.io/integrations/system_log/
#  template functions https://www.home-assistant.io/template-functions/  (to_json, regex_match)
#  RTT API           https://github.com/realtimetrains/api-specification  specification/main.yml
#
# NOT RUN: this version has not been loaded into Home Assistant. The helper and
# both automations are unchanged from the version that was loaded on
# 2026-09-14; only the rest_command and the poll were removed.

input_text:
  railboard_crs:
    name: "Rail board station"
    icon: mdi:train
    min: 3
    max: 3
    pattern: "[A-Z]{3}"
    # No initial: the helper restores its last value across restarts, and the
    # panel's retained selection sets it again anyway. Empty on the very first
    # start, when the polls fall back to GLD.

automation:
  - id: railboard_follow_selection
    alias: "Rail board: follow the station the panel chose"
    description: >-
      The panel publishes its station retained. A valid code is copied into
      input_text.railboard_crs, which the poll and the settings follow. Because
      the message is retained this also runs after every restart.
    mode: queued
    max: 5
    triggers:
      - trigger: mqtt
        topic: "nickoscope_matrix/railboard/select"
    actions:
      - variables:
          want: >-
            {{ (trigger.payload_json.crs | default('') | string)
               if (trigger.payload_json is defined and trigger.payload_json is mapping) else '' }}
      - if:
          # Three capitals and nothing else. The length check matters: '$' in a
          # Python regex also matches before a trailing newline.
          - condition: template
            value_template: "{{ want | length == 3 and want | regex_match('^[A-Z]{3}$') }}"
        then:
          - if:
              - condition: template
                value_template: "{{ states('input_text.railboard_crs') != want }}"
            then:
              - action: input_text.set_value
                target:
                  entity_id: input_text.railboard_crs
                data:
                  value: "{{ want }}"
        else:
          - action: system_log.write
            data:
              logger: railboard
              level: warning
              message: >-
                Rail board: ignored a station selection that is not three capital
                letters: {{ trigger.payload[:40] }}

  - id: railboard_config
    alias: "Rail board: panel settings"
    description: >-
      Retained settings for the page, on the selected station's topic. Edit,
      reload automations, then change station or wait up to 5 min for the panel
      to pick them up.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: input_text.railboard_crs
    actions:
      - variables:
          crs: >-
            {%- set s = states('input_text.railboard_crs') -%}
            {{ s if (s | length == 3 and s | regex_match('^[A-Z]{3}$')) else 'GLD' }}
      - action: mqtt.publish
        data:
          topic: "nickoscope_matrix/railboard/{{ crs }}/config"
          retain: true
          # rows      services listed, 1-8: six to a page, a second page for more
          # switch_s  seconds each list is on screen before the other one
          # level     percent of full colour on this page, 10-100
          # stale_s   Data updating after this long without a fresh board
          # diag      true = show the diagnostics view instead of the board
          payload: >-
            {{ {'v': 1, 'rows': 8, 'switch_s': 10, 'level': 100, 'stale_s': 80,
                'diag': false} | to_json }}
