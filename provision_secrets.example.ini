; Copy to provision_secrets.ini (gitignored), fill in, then:
;   pio run -e provision -t upload
;   pio run -e matrix-waveshare-rgb -t upload
; The provision image writes these into NVS once and prints what it wrote.
; Leave a line out to keep what NVS already holds.
;
; Afterwards, remove the values from the build cache as well:
;   pio run -e provision -t clean
;
; String values need the escaped quotes exactly as shown.
[env:provision]
build_flags =
	${env:matrix-waveshare-rgb.build_flags}
	-DPROV_MQTT_HOST=\"192.168.x.x\"
	-DPROV_MQTT_PORT=1883
	-DPROV_MQTT_USER=\"mqtt-user\"
	-DPROV_MQTT_PASS=\"mqtt-password\"
;	-DPROV_AIS_KEY=\"aisstream-key\"
; Realtime Trains, for the rail board's direct fetch. Easier and unseen:
;   python3 tools/provision_secrets.py rtt-from-ha --kind refresh
;	-DPROV_RTT_TOKEN=\"rtt-token\"
;	-DPROV_RTT_KIND=\"refresh\"
; To remove a stored token instead:
;	-DPROV_RTT_CLEAR
